<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyOS — The Student Operating System</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f8cff'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M18 34l10 10 18-22' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* =====================================================================
   STUDYOS — STYLES
   1. Tokens  2. Base  3. Layout  4. Components  5. Views  6. Responsive
   ===================================================================== */

/* ---------- 1. TOKENS ---------- */
:root{
  --bg:#060a18;--bg2:#0b1230;--panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.075);
  --solid:#0e1631;--line:rgba(255,255,255,.09);--tx:#e9edff;--mut:#8f9ac0;--inp:rgba(255,255,255,.055);
  --blue:#4f8cff;--vio:#8b5cf6;--cyan:#22d3ee;--grn:#34d399;--amb:#fbbf24;--red:#f87171;
  --grad:linear-gradient(135deg,var(--blue) 0%,var(--vio) 100%);--grad2:linear-gradient(135deg,var(--cyan) 0%,var(--blue) 100%);
  --shadow:0 12px 40px rgba(0,0,0,.38);--r:18px;--side:256px;--sidec:78px;--top:68px;
  color-scheme:dark;
}
[data-theme=light]{
  --bg:#eff3fb;--bg2:#e4eafa;--panel:rgba(255,255,255,.78);--panel2:#ffffff;--solid:#ffffff;
  --line:rgba(25,35,80,.11);--tx:#131a38;--mut:#5b6689;--inp:rgba(25,35,80,.05);
  --shadow:0 10px 30px rgba(40,60,130,.13);color-scheme:light;
}

/* ---------- 2. BASE ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,"SF Pro Display",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.5;font-size:.9375rem;overflow-x:hidden;
  background-image:radial-gradient(900px 500px at 8% -5%,rgba(79,140,255,.16),transparent 60%),radial-gradient(800px 500px at 100% 0%,rgba(139,92,246,.14),transparent 60%),radial-gradient(700px 500px at 50% 110%,rgba(34,211,238,.08),transparent 60%);
  background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--blue)}
h1{font-size:1.75rem;letter-spacing:-.02em;line-height:1.2}
h2{font-size:1.05rem;letter-spacing:-.01em}
h3{font-size:.95rem}
.sub{color:var(--mut);font-size:.92rem;margin-top:2px}
.mut{color:var(--mut)}
.ic{flex:none;vertical-align:middle}
::selection{background:rgba(79,140,255,.35)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:8px}

/* ---------- 3. LAYOUT ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh;transition:grid-template-columns .28s ease}
.app.collapsed{grid-template-columns:var(--sidec) 1fr}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border-right:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:40;overflow:hidden}
[data-theme=light] .side{background:rgba(255,255,255,.7)}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px;font-weight:800;font-size:1.2rem;letter-spacing:-.02em;white-space:nowrap}
.logo{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 8px 24px rgba(79,140,255,.4);flex:none}
.brand span em{font-style:normal;background:var(--grad2);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;flex-direction:column;gap:4px;flex:1;overflow-y:auto;overflow-x:hidden}
.nav button{display:flex;align-items:center;gap:13px;padding:11px 13px;border-radius:13px;color:var(--mut);font-weight:550;text-align:left;white-space:nowrap;transition:.2s;position:relative}
.nav button:hover{background:var(--panel2);color:var(--tx)}
.nav button.on{color:#fff;background:var(--grad);box-shadow:0 8px 22px rgba(79,140,255,.3)}
.collapsed .nav button span,.collapsed .brand span,.collapsed .sidefoot .meta{display:none}
.collapsed .nav button{justify-content:center;padding:12px 0}
.collapsed .brand{justify-content:center;padding-left:0;padding-right:0}
.sidefoot{margin-top:10px;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);cursor:pointer;display:flex;gap:11px;align-items:center}
.collapsed .sidefoot{padding:8px;justify-content:center}
.avatar{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.sidefoot .meta{min-width:0;flex:1}.sidefoot .meta b{display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;height:var(--top);display:flex;align-items:center;gap:12px;padding:0 24px;background:rgba(6,10,24,.6);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
[data-theme=light] .top{background:rgba(239,243,251,.78)}
.sbox{position:relative;flex:1;max-width:460px}
.sbox input{width:100%;padding:10px 14px 10px 40px;border-radius:13px;border:1px solid var(--line);background:var(--inp);outline:none;transition:.2s}
.sbox input[type=search]{padding:10px 14px 10px 40px}
.sbox input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,140,255,.18)}
.sbox .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mut)}
.top .sp{flex:1}
.view{padding:26px 28px 60px;max-width:1280px;width:100%;margin:0 auto;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-h{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-h .acts{display:flex;gap:10px;flex-wrap:wrap}
.bottomnav{display:none}
.scrim{display:none}

/* ---------- 4. COMPONENTS ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0;contain:layout style}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-h h2{display:flex;align-items:center;gap:9px}
.card-h h2 .ic{color:var(--cyan)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g-12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.row.sb{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;font-weight:600;border:1px solid var(--line);background:var(--panel2);transition:.2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);border-color:rgba(79,140,255,.5)}
.btn:active{transform:none}
.btn.pri{background:var(--grad);border:0;color:#fff;box-shadow:0 8px 22px rgba(79,140,255,.32)}
.btn.pri:hover{box-shadow:0 10px 28px rgba(139,92,246,.45)}
.btn.danger{color:var(--red);border-color:rgba(248,113,113,.35)}
.btn.danger.solid{background:var(--red);color:#fff;border:0}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;font-size:.84rem;border-radius:10px}
.btn.ico{padding:9px;border-radius:11px}
.btn.big{padding:14px 26px;font-size:1.05rem;border-radius:15px}
.btn[disabled]{opacity:.5;pointer-events:none}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--mut);border:1px solid var(--line);background:var(--panel);position:relative;transition:.2s;flex:none}
.iconbtn:hover{color:var(--tx);background:var(--panel2)}
.dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center;padding:0 4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--inp);border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.chip.on{background:rgba(79,140,255,.18);border-color:rgba(79,140,255,.5);color:var(--tx)}
button.chip{cursor:pointer}button.chip:hover{color:var(--tx)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:8px;font-size:.74rem;font-weight:700}
.b-high,.b-red{background:rgba(248,113,113,.15);color:var(--red)}.b-medium,.b-amb{background:rgba(251,191,36,.15);color:var(--amb)}
.b-low,.b-grn{background:rgba(52,211,153,.15);color:var(--grn)}.b-blue{background:rgba(79,140,255,.17);color:var(--blue)}.b-vio{background:rgba(139,92,246,.18);color:#a78bfa}.b-gray{background:var(--inp);color:var(--mut)}
.sdot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.pbar{height:9px;border-radius:9px;background:var(--inp);overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:9px;background:var(--grad);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.pbar.cy>i{background:var(--grad2)}.pbar.gr>i{background:linear-gradient(90deg,#34d399,#22d3ee)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.8rem;font-weight:600;color:var(--mut)}
.field .hint{font-size:.76rem;color:var(--mut)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:var(--inp);outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,140,255,.18)}
select option{background:var(--solid);color:var(--tx)}
textarea{resize:vertical;min-height:80px}
input[type=checkbox]{accent-color:var(--blue);width:17px;height:17px}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:10px;border:1px solid var(--line);background:var(--inp);cursor:pointer;color:var(--tx);font-weight:550;font-size:.85rem}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer;z-index:2}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--inp);border:1px solid var(--line);transition:.25s}
.switch i:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.25s}
.switch input:checked+i{background:var(--grad);border-color:transparent}.switch input:checked+i:after{transform:translateX(20px)}
.seg{display:inline-flex;padding:4px;border-radius:13px;background:var(--inp);border:1px solid var(--line);gap:2px}
.seg button{padding:7px 14px;border-radius:10px;color:var(--mut);font-weight:600;font-size:.86rem}
.seg button.on{background:var(--grad);color:#fff}
.empty{text-align:center;padding:38px 20px;color:var(--mut)}
.empty .eico{width:64px;height:64px;border-radius:20px;margin:0 auto 14px;display:grid;place-items:center;background:rgba(79,140,255,.13);color:var(--blue)}
.empty h3{color:var(--tx);margin-bottom:4px;font-size:1.05rem}
.empty .btn{margin-top:14px}
.ring{position:relative;display:grid;place-items:center}
.ring .rt{position:absolute;text-align:center;line-height:1.15}
.ring .rt b{font-size:1.45rem;display:block}.ring .rt small{color:var(--mut);font-size:.75rem}
.stat{display:flex;flex-direction:column;gap:6px}
.stat .lbl{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:.85rem;font-weight:600}
.stat .val{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat .hint{color:var(--mut);font-size:.8rem}
.sico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.si-b{background:rgba(79,140,255,.16);color:var(--blue)}.si-v{background:rgba(139,92,246,.18);color:#a78bfa}.si-c{background:rgba(34,211,238,.15);color:var(--cyan)}.si-g{background:rgba(52,211,153,.15);color:var(--grn)}.si-a{background:rgba(251,191,36,.15);color:var(--amb)}.si-r{background:rgba(248,113,113,.15);color:var(--red)}

/* modal / toast / popovers */
.modal-back{position:fixed;inset:0;background:rgba(3,6,18,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:100;display:grid;place-items:center;padding:16px;animation:fadeo .2s}
@keyframes fadeo{from{opacity:0}to{opacity:1}}
.modal{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--solid);border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 90px rgba(0,0,0,.55);padding:24px;animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
.modal.sm{width:min(420px,100%)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.modal h2{font-size:1.25rem;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fgrid .full{grid-column:1/-1}
.macts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.macts .left{margin-right:auto}
#toasts{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;background:var(--solid);border:1px solid var(--line);box-shadow:var(--shadow);max-width:340px;animation:slidein .35s cubic-bezier(.2,.9,.3,1.2);font-size:.9rem}
.toast.xp{border-color:rgba(139,92,246,.5);background:linear-gradient(135deg,rgba(79,140,255,.18),rgba(139,92,246,.18)),var(--solid)}
.toast.err{border-color:rgba(248,113,113,.5)}.toast.ok{border-color:rgba(52,211,153,.5)}
.toast.out{opacity:0;transform:translateX(30px);transition:.3s}
@keyframes slidein{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.pop{position:absolute;top:calc(100% + 10px);right:0;width:min(380px,92vw);max-height:70vh;overflow:auto;background:var(--solid);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.5);padding:10px;z-index:60;animation:pop .2s}
.sbox .pop{left:0;right:auto;width:100%;min-width:300px}
.pop .it{display:flex;gap:11px;align-items:flex-start;padding:10px;border-radius:12px;cursor:pointer;text-align:left;width:100%}
.pop .it:hover{background:var(--panel2)}
.pop .it small{color:var(--mut);display:block}
.pop h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);padding:8px 10px 4px}
.mini-timer{display:flex;align-items:center;gap:8px;padding:8px 13px;border-radius:12px;background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.35);color:var(--cyan);font-weight:700;font-variant-numeric:tabular-nums}
.xpchip{display:flex;align-items:center;gap:8px;padding:8px 13px;border-radius:12px;background:rgba(139,92,246,.14);border:1px solid rgba(139,92,246,.35);font-weight:700;font-size:.86rem}

/* ---------- 5. VIEWS ---------- */
/* dashboard */
.hero{position:relative;overflow:hidden;padding:26px;border-radius:24px;background:linear-gradient(135deg,rgba(79,140,255,.22),rgba(139,92,246,.2) 55%,rgba(34,211,238,.14));border:1px solid var(--line);margin-bottom:18px}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.3),transparent 70%)}
.hero h1{font-size:2rem}.hero .quote{margin-top:12px;display:flex;gap:10px;align-items:center;color:var(--tx);opacity:.92;max-width:680px;position:relative;z-index:1}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.qa button{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:15px;background:var(--panel2);border:1px solid var(--line);text-align:left;font-weight:600;transition:.2s}
.qa button:hover{transform:translateY(-3px);border-color:rgba(79,140,255,.5);box-shadow:0 10px 26px rgba(79,140,255,.18)}
.tl{display:flex;flex-direction:column;gap:10px}
.tl .it{display:flex;gap:12px;align-items:center;padding:11px 13px;border-radius:13px;background:var(--inp);border-left:4px solid var(--blue)}
.tl .it .tm{font-size:.78rem;color:var(--mut);min-width:86px;font-variant-numeric:tabular-nums}
.tl .it b{font-weight:600}
.lvl{display:flex;align-items:center;gap:14px}
.lvlb{width:58px;height:58px;border-radius:18px;background:var(--grad);display:grid;place-items:center;font-size:1.5rem;font-weight:800;color:#fff;box-shadow:0 8px 24px rgba(139,92,246,.4);flex:none}
/* tasks */
.task{display:flex;gap:14px;align-items:flex-start;padding:15px 16px;border-radius:16px;background:var(--panel);border:1px solid var(--line);transition:.2s}
.task:hover{border-color:rgba(79,140,255,.4);transform:translateY(-1px)}
.task .tb{flex:1;min-width:0}.task .tt{font-weight:650;word-break:break-word}
.task .td{color:var(--mut);font-size:.88rem;margin-top:3px;word-break:break-word}
.task .meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;align-items:center}
.task .ta{display:flex;gap:4px}
.task.done .tt{text-decoration:line-through;color:var(--mut)}
.task.od{border-color:rgba(248,113,113,.4)}
.check{width:26px;height:26px;border-radius:9px;border:2px solid var(--mut);display:grid;place-items:center;color:transparent;flex:none;transition:.2s;margin-top:1px}
.check:hover{border-color:var(--blue)}
.check.on{background:var(--grad);border-color:transparent;color:#fff;animation:bump .35s}
@keyframes bump{50%{transform:scale(1.25)}}
.tlist{display:flex;flex-direction:column;gap:10px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.filters select{width:auto;min-width:130px}.filters .sf{flex:1;min-width:200px;position:relative}.filters .sf input{padding-left:38px}.filters .sf .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}
.quick{display:flex;gap:10px}.quick input{flex:1}
/* planner */
.ttwrap{overflow:auto;border-radius:16px;border:1px solid var(--line);background:var(--panel)}
.tt{display:grid;grid-template-columns:56px repeat(7,minmax(104px,1fr));min-width:820px}
.tt .hd{position:sticky;top:0;z-index:3;padding:11px 6px;text-align:center;font-weight:700;font-size:.85rem;background:var(--solid);border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.tt .hd small{display:block;color:var(--mut);font-weight:500}.tt .hd.today{color:var(--cyan)}
.tt .hrs{position:relative}.tt .hrs span{white-space:nowrap;position:absolute;right:8px;font-size:.7rem;color:var(--mut);transform:translateY(-50%)}
.tt .col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hh)}
.tt .col.today{background-color:rgba(34,211,238,.05)}
.blk{position:absolute;left:3px;right:3px;border-radius:11px;padding:5px 8px;font-size:.78rem;overflow:hidden;cursor:pointer;color:#fff;transition:.2s;text-align:left;border:1px solid rgba(255,255,255,.18);box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:1}
.blk:hover{transform:scale(1.02);z-index:2;filter:brightness(1.1)}
.blk b{display:block;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.blk small{opacity:.85}
.blk.brk{background:repeating-linear-gradient(45deg,rgba(52,211,153,.32),rgba(52,211,153,.32) 8px,rgba(52,211,153,.2) 8px,rgba(52,211,153,.2) 16px)!important;color:var(--tx);border:1px dashed rgba(52,211,153,.7)}
.blk.warn{outline:2px solid var(--amb)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:2}.nowline:before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
/* focus */

function filteredTasks() {
  const f = UI.tasks, q = f.q.trim().toLowerCase();
  let l = S.tasks.filter(t => {
    if (f.status === 'pending' && t.done) return false; if (f.status === 'completed' && !t.done) return false; if (f.status === 'overdue' && !isOverdue(t)) return false;
    if (f.pri !== 'all' && t.priority !== f.pri) return false; if (f.subj !== 'all' && (t.subject || '') !== f.subj) return false;
    if (q && !(t.title + ' ' + (t.description || '') + ' ' + (t.subject || '')).toLowerCase().includes(q)) return false; return true;
  });
  const po = { high: 0, medium: 1, low: 2 };
  l.sort((a, b) => {
    if (f.sort === 'priority') return po[a.priority] - po[b.priority] || (a.due || '9').localeCompare(b.due || '9');
    if (f.sort === 'new') return b.created - a.created;
    if (f.sort === 'due-desc') return (b.due || '').localeCompare(a.due || '');
    return (a.due || '9999').localeCompare(b.due || '9999') || po[a.priority] - po[b.priority];
  });
  return l.sort((a, b) => (a.done - b.done) || 0);
}

/* ----- PLANNER ----- */
const dayOrder = () => Array.from({ length: 7 }, (_, i) => (num(S.settings.weekStart, 1) + i) % 7);
const overlaps = (a, b) => a.id !== b.id && a.day === b.day && tmin(a.start) < tmin(b.end) && tmin(a.end) > tmin(b.start);
function vPlanner() {
  const order = dayOrder(), isWeek = UI.plan.view === 'week';
  const starts = S.plan.map(p => tmin(p.start)), ends = S.plan.map(p => tmin(p.end));
  const gs = Math.floor(Math.min(7 * 60, ...starts) / 60) * 60, ge = Math.ceil(Math.max(21 * 60, ...ends) / 60) * 60, HH = 52;
  const wk = weekKeys(), tdow = new Date().getDay();

    const nowM = new Date().getHours() * 60 + new Date().getMinutes();
    body = `<div class="ttwrap"><div class="tt" style="--hh:${HH}px"><div class="hd" style="border-left:0"></div>${order.map(d => { const k = wk.find(x => pdate(x).getDay() === d); return `<div class="hd ${d === tdow ? 'today' : ''}">${DAYS[d]}<small>${k ? fmtDate(k) : ''}</small></div>`; }).join('')}
      <div class="hrs" style="height:${(ge - gs) / 60 * HH}px">${hrs.join('')}</div>

        const top = (tmin(p.start) - gs) / 60 * HH, hh = Math.max(24, (tmin(p.end) - tmin(p.start)) / 60 * HH - 2), warn = S.plan.some(o => overlaps(p, o));
        return `<button class="blk ${p.type === 'break' ? 'brk' : ''} ${warn ? 'warn' : ''}" data-act="plan-edit" data-id="${p.id}" style="top:${top}px;height:${hh}px;background:${subjectColor(p.subject)}" title="${warn ? 'Overlaps with another session' : 'Edit'}"><b>${warn ? '⚠ ' : ''}${esc(p.title)}</b><small>${fmtTime(p.start)}–${fmtTime(p.end)}</small></button>`;
      }).join('')}${d === tdow && nowM >= gs && nowM <= ge ? `<div class="nowline" style="top:${(nowM - gs) / 60 * HH}px"></div>` : ''}</div>`).join('')}

  const y = window.scrollY, v = $('#view'); if (!v) return;
  try { v.innerHTML = VIEWS[route](); } catch (err) { console.error(err); v.innerHTML = `<div class="card">${emptyState('alert', 'Something went wrong', 'This page hit an error. Your data is safe — try another page or reload.', '')}</div>`; }

  'tm-subj': t => { T().subject = t.value; touchSubject(t.value); save(); },
  'tm-custom': () => { const f = $('#tm-f'), b = $('#tm-b'); guardTimer(() => tmCustom(f ? f.value : 25, b ? b.value : T().breakMin, T().kind)); setTimeout(() => { if (T().running || tRemaining() < T().total) render(); }, 0); },
  'exam-status': t => { const e = S.exams.find(x => x.id === t.dataset.id); if (e) { e.status = t.value; save(); refresh(); } },
  'exam-item': t => { const e = S.exams.find(x => x.id === t.dataset.id), c = e && e.checklist.find(x => x.id === t.dataset.i); if (c) { c.done = t.checked; if (c.done) markActive(); save(); render(); } },
  'goal-toggle': t => {
    const k = S.skills.find(s => s.id === t.dataset.id), g = k && k.goals.find(x => x.id === t.dataset.g); if (!g) return;
    g.done = t.checked; if (g.done) { g.xp = 40; markActive(); save(); addXP(40, 'Learning goal complete'); } else { const x = g.xp || 0; g.xp = 0; save(); addXP(-x); } render();
  },
  preset: t => { const p = S.settings.presets[num(t.dataset.i)]; if (!p) return; p[t.dataset.k] = clamp(Math.round(num(t.value, p[t.dataset.k])), 1, t.dataset.k === 'focus' ? 240 : 60); t.value = p[t.dataset.k]; save(); toast('Preset saved', 'ok'); },
  set: t => {
    const k = t.dataset.k;
    if (k === 'name') S.profile.name = t.value.trim().slice(0, 30);
    else if (k === 'goal') { S.profile.goal = clamp(Math.round(num(t.value, 60)), 5, 960); t.value = S.profile.goal; }
    else if (k === 'weekStart') S.settings.weekStart = num(t.value, 1);
    else if (k === 'compact' || k === 'motion' || k === 'autoStart') { S.settings[k] = t.checked; applyPrefs(); }
    else if (k === 'sound') { S.settings.sound = t.checked; if (t.checked) { ensureAudio(); beep(); } }
    save(); chrome(); toast('Saved', 'ok');
  }
};

/* ---------- GLOBAL EVENT WIRING ---------- */
document.addEventListener('click', e => {
  if (S && S.settings.sound) ensureAudio();
  if (UI.panel && !e.target.closest('.pop') && !e.target.closest('[data-act=bell]') && !e.target.closest('.sbox')) { UI.panel = null; syncPanels(); }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = A[el.dataset.act]; if (!f) return;
  if (['go', 'sr'].includes(el.dataset.act) || el.closest('.side')) closeDrawer();
  f(el.dataset, el, e);
});
document.addEventListener('input', e => { const t = e.target.closest && e.target.closest('[data-in]'); if (t && IN[t.dataset.in]) IN[t.dataset.in](t, e); });
document.addEventListener('change', e => { const t = e.target.closest && e.target.closest('[data-ch]'); if (t && CH[t.dataset.ch]) CH[t.dataset.ch](t, e); });
document.addEventListener('mousedown', e => { if (e.target.closest('.ntool button,.npanel button')) e.preventDefault(); });
document.addEventListener('paste', e => { if (e.target.id === 'nbody') { e.preventDefault(); const tx = (e.clipboardData || window.clipboardData).getData('text/plain'); document.execCommand('insertText', false, tx); } });
document.addEventListener('focusin', e => { if (e.target.id === 'gsearch' && UI.searchQ.trim()) { UI.panel = 'search'; syncPanels(); } });
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Enter' && t.dataset && t.dataset.enter && A[t.dataset.enter]) { e.preventDefault(); A[t.dataset.enter](t.dataset, t, e); return; }
  if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('.sidefoot') ) { e.preventDefault(); go('settings'); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); const g = $('#gsearch'); if (g) g.focus(); return; }
  if (e.key === 'Escape') {
    const ms = $$('.modal-back'); if (ms.length) { ms[ms.length - 1].remove(); return; }
    if (fmOn) { fmExit(); return; } if (UI.panel) { UI.panel = null; syncPanels(); return; } closeDrawer(); return;
  }
  const typing = t.matches && t.matches('input,textarea,select,[contenteditable=true]');
  if (route === 'cards' && UI.cards.deck && !typing && !$('.modal-back')) {
    if (e.key === 'ArrowRight') { e.preventDefault(); A['card-next'](); } else if (e.key === 'ArrowLeft') { e.preventDefault(); A['card-prev'](); } else if (e.key === ' ' && UI.cards.order.length) { e.preventDefault(); A.flip(); }
  }
});
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && fmOn) fmExit(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) tmTick(); });
window.addEventListener('hashchange', () => { noteFlush(); parseRoute(); UI.panel = null; syncPanels(); closeDrawer(); render(true); });
window.addEventListener('beforeunload', () => { noteFlush(); });
window.addEventListener('pagehide', () => { noteFlush(); });
$('#impfile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
  const rd = new FileReader(); rd.onload = () => { const ov = $$('.modal-back'); doImport(String(rd.result), `backup “${f.name}”`, () => ov.forEach(x => x.remove())); };
  rd.onerror = () => toast('Could not read that file', 'err'); rd.readAsText(f);
});

/* ---------- ONBOARDING ---------- */
function showOnboarding() {
  const ob = document.createElement('div'); ob.id = 'ob'; let goal = 60;
  ob.innerHTML = `<div class="box"><div class="logo" style="width:54px;height:54px;border-radius:17px">${ic('check', 30)}</div><h1>Welcome to Study<span style="background:var(--grad2);-webkit-background-clip:text;background-clip:text;color:transparent">OS</span></h1>
    <p class="sub" style="margin-bottom:22px">Your personal operating system for school. Let's set it up in 10 seconds.</p>
    <div class="field" style="margin-bottom:18px"><label for="obn">What should we call you?</label><input type="text" id="obn" placeholder="Your name" maxlength="30" autocomplete="given-name"></div>
    <div class="field" style="margin-bottom:18px"><label>Daily study goal</label><div class="goals">${[30, 60, 90, 120].map(m => `<button type="button" data-g="${m}" class="${m === 60 ? 'on' : ''}">${m} min</button>`).join('')}</div><span class="hint">A gentle target — missing it never costs you anything. Change it any time in Settings.</span></div>
    <label class="sample" style="cursor:pointer;margin-bottom:22px"><input type="checkbox" id="obs"><div><b>Load sample data</b><div class="mut" style="font-size:.84rem">Fill the app with example tasks, notes and flashcards so you can explore. Optional.</div></div></label>
    <button class="btn pri big" style="width:100%" id="obgo">Get started ${ic('right', 18)}</button></div>`;
  document.body.appendChild(ob);
  ob.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { goal = num(b.dataset.g, 60); ob.querySelectorAll('[data-g]').forEach(x => x.classList.toggle('on', x === b)); });
  const start = () => {
    const nm = $('#obn').value.trim(); if (!nm) { $('#obn').focus(); toast('Please tell us your name', 'err'); return; }
    S.profile.name = nm; S.profile.goal = goal; S.profile.setup = true; S.profile.created = today(); save();
    if ($('#obs').checked) loadSample(); ob.remove(); go('dashboard'); render(true); toast(`Welcome, ${nm}! Let's have a great day.`, 'ok');
  };
  $('#obgo').onclick = start; $('#obn').addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
  setTimeout(() => $('#obn').focus(), 80);
}

/* ---------- 10. INIT ---------- */
function init() {
  load(); sanitizeIds(S); applyPrefs(); parseRoute(); buildShell();
  if (!S.profile.setup) showOnboarding();
  render(true);
  setInterval(tmTick, 250);
  setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); } }, 30000);
  setInterval(() => { if (route === 'dashboard') A.quote(); }, 45000);
}
try { init(); } catch (err) { console.error(err); document.getElementById('root').innerHTML = '<div style="padding:40px;max-width:560px;margin:auto"><h2>StudyOS hit a startup error</h2><p style="margin:10px 0">Your saved data may be damaged. Open the browser console for details, or reset the saved data below.</p><button class="btn danger" onclick="localStorage.removeItem(\'studyos.v1\');location.reload()">Reset saved data</button></div>'; }
</script>
</body>
</html>
